[package]
name = "oci-unpack"
version = "0.1.1"
edition = "2021"
authors = ["ayosec@gmail.com"]
license = "Apache-2.0"

description = "Download and unpack OCI images."
keywords = ["container-image", "oci"]

readme = "README.md"
documentation = "https://docs.rs/oci-unpack"
repository = "https://github.com/labtable/oci-unpack"

[dependencies]
digest = { version = "0.11.3", default-features = false }
flate2 = "1.1.10"
http = "1.5.0"
landlock = { version = "0.4.7", optional = true }
libc = "0"
lru = { version = "0.19.0", default-features = false }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
ureq = "3.5.0"
zstd = { version = "0.14.3", default-features = false, optional = true }

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
tiny_http = { version = "0.12.0", default-features = false }
url = "2.5.8"

[features]
default = ["sandbox", "zstd"]
sandbox = ["dep:landlock"]
zstd = ["dep:zstd"]
